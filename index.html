<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKA Fence</title>

    <style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #deb237, #caa52a);;
    min-height: 100vh;
}

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

     .banner {
    width: 100%;
    display: block;
    margin: 0;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
}

        .qr-code {
            width: 250px;
            max-width: 80%;
            margin-bottom: 20px;
        }

        .scan-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .scan-list {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 35px;
        }

.job-button {
    display: block;
    width: 80%;
    margin: 20px auto 0;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
}

        .tracker-button:hover {
            background: #222222;
        }
    </style>
</head>
<body>

    <div class="container">

        <img src="banner.png" class="banner">

        <img src="qr-code.png" class="qr-code">

        <div class="scan-text">
            Scan For:
        </div>

        <div class="scan-list">
            Website<br>
            Gallery<br>
            Estimates<br>
            Contact Information
        </div>

      <a href="jobtracker.html" class="job-button">
    Open Job Tracker
</a>

    </div>

</body>
</html>
