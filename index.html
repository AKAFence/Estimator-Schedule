<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKA Fence</title>

    <style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #DEB83B;
    min-height: 100vh;

    display: flex;
    justify-content: center;
}

        .container {
    text-align: center;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 0;
}

     .banner {
    width: 100%;
    display: block;
    margin: 0;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
}

        .qr-code {
    width: 250px;
    max-width: 80%;
    margin: 20px 0 10px 0;
}
.job-button {
    display: block;
    width: 80%;
    margin: 30px auto 0;  /* more balanced */
    background: #000;
    color: #fff;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    opacity: 0.9;
}

.job-button:hover {
    opacity: 1;
}

        .tracker-button:hover {
            background: #222222;
        }
    </style>
</head>
<body>

    <div class="container">

        <img src="banner.png" class="banner">

        <img src="qr-code.png" class="qr-code">

    

      <a href="jobtracker.html" class="job-button">
    Open Job Tracker
</a>

    </div>

</body>
</html>
