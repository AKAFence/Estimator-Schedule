<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Current Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Figtree', sans-serif;
    background: #f6f7fb;
    margin: 0;
    padding: 10px;
    font-size: 12px;
    color: #323338;
}
body {
    -webkit-overflow-scrolling: touch;
}
.header {
    position: sticky;
    top: 0;
    z-index: 999;

    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 14px;
    margin-bottom: 10px;

    padding: 12px;

    box-shadow: 0 6px 18px rgba(0,0,0,0.06);

    font-family: 'Poppins', sans-serif;
}

.job-card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    box-shadow: 0px 3px 6px rgba(0,0,0,0.08);
}
#jobsContainer {
    transition: transform 0.3s ease, opacity 0.3s ease;
}.slide-out-left {
    transform: translateX(-40px);
    opacity: 0;
}

.slide-out-right {
    transform: translateX(40px);
    opacity: 0;
}
.job-name {
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
}

.job-expanded {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eee;
}

.job-details {
    font-size: 11px;
    color: #676879;
    margin-bottom: 4px;
}

.nav-link {
    color: #0073ea;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
}

/* NAV MODAL */
.nav-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 9999;
}

.nav-modal.active {
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

.nav-sheet {
    width: calc(100% - 16px);
    max-width: 420px;
    margin: 0 auto 10px auto;

    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 20px;
    padding: 12px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.18);

    animation: slideUp 0.2s ease;
}

.nav-sheet button {
    width: 100%;
    background: #f2f2f7;
    border: none;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 6px;
    font-size: 14px;
    cursor: pointer;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}
#weekLabel {
    font-size: 12px;
    font-weight: 500;
    color: #8a8f99;
.header button {
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
}
#weekLabel div:first-child {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #ffecec;
    color: #d64545;
    font-size: 13px;
    font-weight: 600;
}
.header button {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: none;

    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);

    font-size: 14px;
    font-weight: 600;
    color: #323338;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: all 0.15s ease;
}
.header button:active {
    transform: scale(0.92);
    background: #f2f2f7;
}
.header button {
    margin: 0 4px;
}
.week-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.week-pill {
    flex: 1;
    text-align: center;
    background: #eef2ff;
    color: #2f3a8f;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.nav-arrow {
    background: white;
    border: 1px solid #ddd;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
}
.slide-left {
    animation: slideLeft 0.25s ease;
}

.slide-right {
    animation: slideRight 0.25s ease;
}

@keyframes slideLeft {
    from { transform: translateX(25px); opacity: 0.4; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes slideRight {
    from { transform: translateX(-25px); opacity: 0.4; }
    to { transform: translateX(0); opacity: 1; }
}
.nav-arrow {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-arrow:active {
    transform: scale(0.95);
}
.shimmer-card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
}

.shimmer {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(
        90deg,
        #f3f4f6 25%,
        #e5e7eb 37%,
        #f3f4f6 63%
    );
    background-size: 400% 100%;
    animation: shimmerMove 1.2s ease infinite;
    margin-bottom: 8px;
}

@keyframes shimmerMove {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
}
</style>
</head>

<body>

<div class="header">
    <div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:8px;">
        Current Jobs
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <button class="nav-arrow" onclick="changeWeek(-1)">◀</button>

        <div id="weekLabel"></div>

        <button class="nav-arrow" onclick="changeWeek(1)">▶</button>
    </div>
</div>

<div id="jobsContainer"></div>

<!-- NAV MODAL -->
<div class="nav-modal" id="navModal">
    <div class="nav-sheet">
        <div style="font-weight:700;text-align:center;margin-bottom:10px;">
            Navigate With
        </div>

        <button onclick="openGoogleMaps()">Google Maps</button>
        <button onclick="openAppleMaps()">Apple Maps</button>
        <button onclick="openWaze()">Waze</button>
    </div>
</div>

<script>

let weekOffset = 0;
const BOARD_ID = 18411800966;

const apiToken = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1OTAwMTUzOSwiYWFpIjoxMSwidWlkIjoxMDMyMTQ4NzcsImlhZCI6IjIwMjYtMDUtMTVUMTQ6NTY6MDguMDAwWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM0OTg5MTQ2LCJyZ24iOiJ1c2UxIn0.Qo7Od1W81aOHJDMCzDmhdJ_-7dAexxnpTN4468PGln0";

let allJobs = [];
let navigationAddress = "";

// ================= LOADING =================
function showLoading() {
    const container = document.getElementById("jobsContainer");
    container.innerHTML = "";

    for (let i = 0; i < 5; i++) {
        container.innerHTML += `
            <div class="shimmer-card">
                <div class="shimmer" style="width:60%"></div>
                <div class="shimmer" style="width:90%"></div>
                <div class="shimmer" style="width:40%"></div>
            </div>
        `;
    }
}

// ================= LOAD =================
async function loadJobs() {

    showLoading();

    const query = `
    query {
        boards(ids: [${BOARD_ID}]) {
            items_page(limit: 200) {
                items {
                    id
                    name
                    group { title }
                    column_values(ids: [
                        "text_mm3zf47z",
                        "date_mm3zmjgk"
                    ]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data?.data?.boards?.[0]?.items_page?.items || [];
    allJobs = items.map(parseJob);

    refreshUI();
}

// ================= PARSE =================
function parseJob(item) {
    let job = {
        id: item.id,
        name: item.name,
        location: "",
        date: "",
        estimator: item.group?.title || ""
    };

    item.column_values.forEach(col => {
        if (col.id === "text_mm3zf47z") job.location = col.text || "";
        if (col.id === "date_mm3zmjgk") job.date = col.text || "";
    });

    return job;
}

// ================= WEEK FILTER =================
function getCurrentJobs() {

    const now = new Date();

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    return allJobs
        .filter(job => {
            if (!job.date) return false;

            const [y,m,d] = job.date.split("-");
            const jobDate = new Date(y, m-1, d);

            return jobDate >= start && jobDate <= end;
        })
        .sort((a,b) => {
            const [ay,am,ad] = a.date.split("-");
            const [by,bm,bd] = b.date.split("-");
            return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
        });
}

// ================= RENDER =================
function renderJobs() {

    const container = document.getElementById("jobsContainer");
    container.innerHTML = "";

    const jobs = getCurrentJobs();

    if (!jobs.length) {
        container.innerHTML = "<div>No jobs this week</div>";
        return;
    }

    jobs.forEach(job => {

        const card = document.createElement("div");
        card.className = "job-card";

        card.innerHTML = `
            <div class="job-name" onclick="toggleCard('${job.id}')">
                ${job.name}
            </div>

            <div class="job-details">
                📅 ${formatDate(job.date)}
            </div>

            <div id="details-${job.id}" class="job-expanded">

                <div class="job-details nav-link"
                    onclick="openNavigation('${job.location}')">
                    📍 ${job.location || "No location"}
                </div>

                <div class="job-details">
                    👷 ${job.estimator}
                </div>

            </div>
        `;

        container.appendChild(card);
    });
}

// ================= WEEK LABEL =================
function updateWeekLabel() {

    const now = new Date();

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    let labelText = "";

    if (weekOffset === 0) labelText = "This Week";
    else if (weekOffset === -1) labelText = "Last Week";
    else if (weekOffset === 1) labelText = "Next Week";
    else if (weekOffset < -1) labelText = `${Math.abs(weekOffset)} Weeks Back`;
    else labelText = `${weekOffset} Weeks Ahead`;

    document.getElementById("weekLabel").innerHTML =
    `<div style="
        text-align:center;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        line-height:1.2;
    ">
        <div style="
            font-size:12px;
            font-weight:600;
            color:#d64545;
            padding:4px 10px;
            border-radius:999px;
            background:#ffecec;
            margin-bottom:3px;
        ">
            ${labelText}
        </div>

        <div style="
            font-size:10px;
            color:#8a8f99;
            font-weight:400;
        ">
            ${start.toLocaleDateString()} - ${end.toLocaleDateString()}
        </div>
    </div>`;
}

// ================= UI CONTROLLER =================
function refreshUI() {
    updateWeekLabel();
    renderJobs();
}

// ================= WEEK CHANGE =================
function changeWeek(direction) {
    weekOffset += direction;
    refreshUI();
}

// ================= TOGGLE =================
function toggleCard(id) {
    const el = document.getElementById(`details-${id}`);
    if (!el) return;
    el.style.display = el.style.display === "block" ? "none" : "block";
}

// ================= NAV =================
function openNavigation(addr) {
    if (!addr) return;
    navigationAddress = addr;
    document.getElementById("navModal").classList.add("active");
}

function closeNavModal() {
    document.getElementById("navModal").classList.remove("active");
}

document.getElementById("navModal").addEventListener("click", closeNavModal);

function openGoogleMaps() {
    window.location.href =
        `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(navigationAddress)}`;
    closeNavModal();
}

function openAppleMaps() {
    window.location.href =
        `maps://?daddr=${encodeURIComponent(navigationAddress)}`;
    closeNavModal();
}

function openWaze() {
    window.location.href =
        `https://waze.com/ul?q=${encodeURIComponent(navigationAddress)}&navigate=yes`;
    closeNavModal();
}

// ================= DATE =================
function formatDate(dateString) {
    if (!dateString) return "No date";
    const [y,m,d] = dateString.split("-");
    return new Date(y,m-1,d).toLocaleDateString();
}

// ================= INIT =================
loadJobs();

setInterval(loadJobs, 120000);

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        loadJobs();
    }
});
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe() {
    const diff = touchEndX - touchStartX;

    if (Math.abs(diff) < 60) return;

    if (diff > 0) {
        changeWeek(-1);
    } else {
        changeWeek(1);
    }
}
</script>

</body>
</html>
