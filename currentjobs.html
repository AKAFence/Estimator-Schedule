<script>

    { key: "matt", color: "#0073ea" }
];
let viewMode = "week";
let isDragging = false;
let startX = 0;
let currentX = 0;
let translateX = 0;
let weekOffset = 0;
let monthOffset = 0;
const BOARD_ID = 18411800966;

const apiToken = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1OTAwMTUzOSwiYWFpIjoxMSwidWlkIjoxMDMyMTQ4NzcsImlhZCI6IjIwMjYtMDUtMTVUMTQ6NTY6MDguMDAwWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM0OTg5MTQ2LCJyZ24iOiJ1c2UxIn0.Qo7Od1W81aOHJDMCzDmhdJ_-7dAexxnpTN4468PGln0";

let allJobs = [];
let navigationAddress = "";
let offDays = [];

try {
    offDays = JSON.parse(localStorage.getItem("offDays")) || [];
} catch (e) {
    offDays = [];
}

// ================= LOADING =================
function showLoading() {
    const container =
        document.getElementById("weekView") ||
        document.getElementById("calendarView");

    if (!container) return;

    container.innerHTML = "";

    for (let i = 0; i < 5; i++) {

        `;
    }
}
function setInitialView() {
    if (window.innerWidth >= 769) {
        viewMode = "calendar";
    } else {
        viewMode = "week";
    }
}

setInitialView();

window.addEventListener("resize", () => {
    if (window.innerWidth >= 769) {
        viewMode = "calendar";
    } else {
        viewMode = "week";
    }

    refreshUI();
});
async function loadOffDays() {
    const query = `
    query {
        boards(ids: [18416843280]) {
            items_page(limit: 200) {
                items {
                    name
                    column_values(ids: [
                        "text_mm443k8p",
                        "date_mm44r5ag",
                        "date_mm44r779"
                    ]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data?.data?.boards?.[0]?.items_page?.items || [];

    offDays = items.map(item => {
        const get = (id) =>
            item.column_values.find(c => c.id === id)?.text || "";

        return {
            name: get("text_mm443k8p") || item.name,
            startDate: get("date_mm44r5ag"),
            endDate: get("date_mm44r779") || get("date_mm44r5ag")
        };
    });

    refreshUI();
}

// ================= LOAD =================
async function loadJobs() {

    showLoading();

    const query = `
    query {
        boards(ids: [${BOARD_ID}]) {
            items_page(limit: 200) {
                items {
                    id
                    name
                    group { title }
    column_values(ids: [
    "text_mm3zf47z",
    "date_mm3zmjgk",
    "date_mm45r6e3",
    "long_text_mm40xxhd",
    "text_mm46zh5y",
    "numeric_mm46tmad"
]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data?.data?.boards?.[0]?.items_page?.items || [];
    allJobs = items.map(parseJob).filter(Boolean);

    refreshUI();
}

// ================= PARSE =================
function parseJob(item) {
    const name = item.name || "";
    const groupRaw = (item.group?.title || "").trim().toLowerCase();

    let estimator = "";

    // estimator assignment (BASED ON GROUPS IN MONDAY)
    if (groupRaw === "tom") estimator = "tom";
    else if (groupRaw === "brad") estimator = "brad";
    else if (groupRaw === "matt") estimator = "matt";
    else if (groupRaw.includes("repair")) estimator = "repair";
    else if (groupRaw.includes("completed")) estimator = "completed";
    else estimator = "unknown";

    const job = {
    id: item.id,
    name,
    estimator,
    originalEstimator: estimator,
    group: groupRaw,
    isRepair: groupRaw.includes("repair"),

    location: "",
    phone: "",
    laborers: 1,

    date: "",
    description: ""
};

   item.column_values.forEach(col => {

    if (col.id === "text_mm3zf47z")
        job.location = col.text || "";

    if (col.id === "date_mm3zmjgk")
        job.date = col.text || "";

    if (col.id === "date_mm45r6e3")
        job.endDate = col.text || "";

    if (col.id === "long_text_mm40xxhd")
        job.description = col.text || "";

    if (col.id === "text_mm46zh5y")
        job.phone = col.text || "";

    if (col.id === "numeric_mm46tmad")
        job.laborers = col.text || "1";
});

// normalize missing values
if (!job.date) job.date = null;
if (!job.endDate) job.endDate = job.date;

return job;
}

// ================= WEEK FILTER =================
function getCurrentJobs() {

    const now = new Date();

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    return allJobs
        .filter(job => {
            if (!job.date) return false;

            const [y,m,d] = job.date.split("-");
            const jobDate = new Date(y, m-1, d);

            return jobDate >= start && jobDate <= end;
        })
        .sort((a,b) => {
            const [ay,am,ad] = a.date.split("-");
            const [by,bm,bd] = b.date.split("-");
            return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
        });
}

// ================= RENDER =================
console.log("Jobs rendering:", allJobs);
function renderJobs() {

   const container = document.getElementById("weekView");
    container.innerHTML = "";

    const jobs = getCurrentJobs();

    if (!jobs.length) {

        return;

${job.description ? `
<div class="job-details" style="

    padding:6px 8px;
    background:#f8f9fc;
    border-radius:6px;
    color:#555;
">
    📝 ${job.description}
</div>
` : ""}

<div id="details-${job.id}" class="job-expanded">

                <div class="job-details nav-link"
                    onclick="openNavigation('${job.location}')">
                    📍 ${job.location || "No location"}
                </div>

                <div class="job-details">
                    👷 ${job.estimator}
                </div>

            </div>
        `;

        container.appendChild(card);
    });
}

// ================= WEEK LABEL =================
function updateWeekLabel() {
    const now = new Date();

    if (viewMode === "calendar") {
        const currentMonth = new Date(
            now.getFullYear(),
            now.getMonth() + monthOffset,
            1
        );

        document.getElementById("weekLabel").innerHTML = `
            <div style="
                font-size:12px;
                font-weight:600;
                color:#2f3a8f;
                padding:4px 10px;
                border-radius:999px;
                background:#eef2ff;
            ">
                ${currentMonth.toLocaleDateString(undefined,{
                    month:'long',
                    year:'numeric'
                })}
            </div>
        `;
        return;
    }

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    document.getElementById("weekLabel").innerHTML = `
        <div style="text-align:center;line-height:1.2;">
            <div style="
                font-size:12px;
                font-weight:600;
                color:#d64545;
                padding:4px 10px;
                border-radius:999px;
                background:#ffecec;
                margin-bottom:3px;
            ">
                ${weekOffset === 0 ? "This Week" : `Week ${weekOffset}`}
            </div>

            <div style="font-size:10px;color:#8a8f99;">
                ${start.toLocaleDateString()} - ${end.toLocaleDateString()}
            </div>
        </div>
    `;
}

                ${currentMonth.toLocaleDateString(undefined,{

                    year:'numeric'
                })}
            </div>
        `;
        return;
    }

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    document.getElementById("weekLabel").innerHTML = `
        <div style="text-align:center;line-height:1.2;">
            <div style="
                font-size:12px;
                font-weight:600;
                color:#d64545;
                padding:4px 10px;
                border-radius:999px;
                background:#ffecec;
                margin-bottom:3px;
            ">
                ${weekOffset === 0 ? "This Week" : `Week ${weekOffset}`}
            </div>

            <div style="font-size:10px;color:#8a8f99;">
                ${start.toLocaleDateString()} - ${end.toLocaleDateString()}
            </div>
        </div>
    `;
}

function changeWeek(direction) {

    const screen = document.getElementById("screen");

    screen.classList.add(
        direction === 1
            ? "slide-left-out"
            : "slide-right-out"
    );

    setTimeout(() => {

        if (viewMode === "week") {
            weekOffset += direction;
        } else {
            monthOffset += direction;
        }

        refreshUI();

        screen.classList.remove(
            "slide-left-out",
            "slide-right-out"
        );

        void screen.offsetWidth;

    }, 180);
}

let touchStartX = 0;
let touchEndX = 0;
let touchStartY = 0;
let touchEndY = 0;
const screen = document.getElementById("screen");

screen.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
});

screen.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
});

function handleSwipe() {
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;

    // ignore small gestures
    if (Math.abs(diffX) < 60) return;

    // ignore vertical scroll gestures
    if (Math.abs(diffY) > Math.abs(diffX)) return;

    if (diffX > 0) {
        changeWeek(-1);
    } else {
        changeWeek(1);
    }
}
