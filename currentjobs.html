<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Current Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Figtree', sans-serif;
    background: #f6f7fb;
    margin: 0;
    padding: 10px;
    font-size: 12px;
    color: #323338;
}

.header {
    background: white;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 700;
}

.job-card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    box-shadow: 0px 3px 6px rgba(0,0,0,0.08);
}

.job-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
}

.job-details {
    font-size: 11px;
    color: #676879;
    margin-bottom: 4px;
}

.nav-btn {
    margin-top: 6px;
    background: #0073ea;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Current Jobs</div>

<div id="jobsContainer"></div>

<script>
// ===== CONFIG =====
const BOARD_ID = 18411800966;

let apiToken = localStorage.getItem('mondayApiToken') || '';
let allJobs = [];

// ===== LOAD JOBS =====
async function loadJobs() {
    const query = `
    query {
        boards(ids: [${BOARD_ID}]) {
            items_page(limit: 200) {
                items {
                    id
                    name
                    group { title }
                    column_values(ids: [
                        "location_mm326h2a",
                        "date_mm32f8nr"
                    ]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data.data.boards[0].items_page.items;

    allJobs = items.map(parseJob);

    renderJobs();
}

// ===== PARSE =====
function parseJob(item) {
    let job = {
        id: item.id,
        name: item.name,
        estimator: item.group.title,
        location: '',
        date: ''
    };

    item.column_values.forEach(col => {
        if (col.id === "location_mm326h2a") {
            job.location = col.text || "";
        }
        if (col.id === "date_mm32f8nr") {
            job.date = col.text || "";
        }
    });

    return job;
}

// ===== FILTER CURRENT JOBS =====
function getCurrentJobs() {
    return allJobs
        .filter(j => j.date)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
}

// ===== RENDER =====
function renderJobs() {
    const container = document.getElementById("jobsContainer");
    container.innerHTML = "";

    const jobs = getCurrentJobs();

    jobs.forEach(job => {
        const card = document.createElement("div");
        card.className = "job-card";

        const date = job.date
            ? new Date(job.date).toLocaleDateString()
            : "";

        card.innerHTML = `
            <div class="job-name">${job.name}</div>
            <div class="job-details">📍 ${job.location || "No location"}</div>
            <div class="job-details">📅 ${date}</div>
            <button class="nav-btn" onclick="navigate('${job.location}')">
                Navigate
            </button>
        `;

        container.appendChild(card);
    });
}

// ===== NAV =====
function navigate(address) {
    if (!address) return;

    const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`;
    window.open(url, "_blank");
}

// ===== INIT =====
loadJobs();
</script>

</body>
</html>
