<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Current Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    box-sizing: border-box;
}
body {
    font-family: 'Figtree', sans-serif;
    background: #f6f7fb;
    margin: 0;
    padding: 14px;
    font-size: 12px;
    color: #323338;
    overflow-x: hidden;
}
body {
    -webkit-overflow-scrolling: touch;
}
.header {
    position: sticky;
    top: 0;
    z-index: 200500;

    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 14px;
    margin-bottom: 10px;

    padding: 12px;

    box-shadow: 0 6px 18px rgba(0,0,0,0.06);

    font-family: 'Poppins', sans-serif;
}

.job-card {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0px 6px 16px rgba(0,0,0,0.08);
}
#jobsContainer {
    transition: transform 0.3s ease, opacity 0.3s ease;
}
#weekView,
#calendarView {
    padding: 0 10px 0 10px;
}
.slide-out-left {
    transform: translateX(-40px);
    opacity: 0;
}

.slide-out-right {
    transform: translateX(40px);
    opacity: 0;
}
.job-name {
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.job-expanded {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eee;
}

.job-details {
    font-size: 11px;
    color: #676879;
    margin-bottom: 4px;
}

.nav-link {
    color: #0073ea;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
}

.search-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f2f2f7;
    border: 1px solid rgba(60,60,67,0.18);
    border-radius: 20px;
    padding: 10px 12px;
    width: 100%;
    max-width: 720px;
    min-width: 0;
}

.search-pill input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 16px;
    color: #1c1c1e;
    width: 100%;
    min-width: 0;
}

.search-pill input::placeholder {
    color: #8e8e93;
}

.search-pill-button {
    border: none;
    background: #007aff;
    color: white;
    border-radius: 16px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-width: 74px;
    box-shadow: 0 8px 20px rgba(0,122,255,0.18);
}

.search-pill-button:hover {
    background: #006ce6;
}

.search-pill-button:active {
    transform: scale(0.98);
}

.header-top {
    display: flex;
    align-items: center;
    position: relative;
    gap: 12px;
    padding-right: 20px;
}

.header-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
}

.header-search {
    margin-left: auto;
    flex: 0 0 auto;
    width: clamp(180px, 30vw, 420px);
    max-width: 420px;
    min-width: 0;
}

@media (max-width: 768px) {
    .header-top {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        column-gap: 12px;
        justify-content: space-between;
    }

    .header-title {
        position: static;
        transform: none;
        justify-self: start;
        margin-bottom: 0;
        width: auto;
    }

    .header-search {
        justify-self: stretch;
        margin-left: 0;
        width: 100%;
        max-width: none;
        min-width: 0;
    }

    .search-pill {
        width: 100%;
        max-width: 100%;
        min-width: 0;
    }
}

/* NAV MODAL */
.nav-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1100;
}

.nav-modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

#navModal.nav-modal.active {
    align-items: flex-end;
}

.nav-sheet {
    width: 92%;
    max-width: 520px;
    margin: auto;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.18);
    max-height: 90vh;
    overflow-y: auto;
}

#navModal .nav-sheet {
    margin: 0 auto 10px auto;
    transform: translateY(100%);
    animation: slideUp 0.25s ease forwards;
    border-radius: 24px;
    background: rgba(255,255,255,0.98);
    padding: 16px;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

#jobDetailModal.nav-modal.active,
#addJobModal.nav-modal.active,
#offDayModal.nav-modal.active {
    justify-content: center;
    align-items: center;
}

.nav-title {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 12px;
    color: #1c1c1e;
}

.nav-btn {
    width: 100%;
    background: #f2f2f7;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    color: #1c1c1e;
    margin-bottom: 6px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
}

.nav-btn:active {
    transform: scale(0.98);
    background: #e5e5ea;
}

.safari-bottom-bar {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: auto;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    z-index: 1000001;
    pointer-events: auto;
}

.safari-handle {
    pointer-events: auto;
    width: 58px;
    height: 32px;
    border-radius: 999px;
    border: none;
    background: rgba(60, 60, 67, 0.22);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.safari-handle-dots {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
}

.safari-handle-dots::before,
.safari-handle-dots::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    top: 0;
}

.safari-handle-dots::before {
    left: -12px;
}

.safari-handle-dots::after {
    right: -12px;
}

.safari-menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.24);
    z-index: 300100;
    align-items: flex-end;
    justify-content: center;
    padding: 0 14px 14px;
}

.safari-menu-overlay.active {
    display: flex;
}

.safari-menu-card {
    width: min(100%, 420px);
    background: rgba(255, 255, 255, 0.98);
    border-radius: 24px;
    padding: 14px;
    box-shadow: 0 28px 60px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.safari-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid rgba(60, 60, 67, 0.10);
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.16s ease, background 0.16s ease;
}

.safari-menu-item:last-child {
    margin-bottom: 0;
}

.safari-menu-item:hover {
    background: #f2f2f7;
    transform: translateY(-1px);
}

.safari-menu-icon {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border-radius: 12px;
    background: #f2f2f7;
}

.safari-menu-label {
    font-size: 15px;
    font-weight: 600;
    color: #1c1c1e;
}

body.menu-open {
    overflow: hidden;
}

.nav-arrow {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-arrow:active {
    transform: scale(0.95);
}
.shimmer-card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
}

.shimmer {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(
        90deg,
        #f3f4f6 25%,
        #e5e7eb 37%,
        #f3f4f6 63%
    );
    background-size: 400% 100%;
    animation: shimmerMove 1.2s ease infinite;
    margin-bottom: 8px;
}

@keyframes shimmerMove {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
}

.slide-left-out {
    transform: translateX(-30px);
    opacity: 0;
}

.slide-right-out {
    transform: translateX(30px);
    opacity: 0;
}

.slide-in {
    transform: translateX(0);
    opacity: 1;
}
.repair-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 20px;
    height: 20px;

    background: #fff4e5;
    color: #c56a00;

    border-radius: 50%;
    font-size: 11px;

    flex-shrink: 0;
}
body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}
#addJobModal .nav-sheet,
#offDayModal .nav-sheet {
    width: 92%;
    max-width: 420px;
    margin: auto;
    border-radius: 16px;
}
#addJobModal .nav-sheet {
    background: white;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: popIn 0.18s ease;
}
#offDayModal {
    align-items: center !important;
}
#addJobModal input,
#addJobModal textarea,
#offDayModal input,
#offDayModal textarea {
    width: 100%;
    box-sizing: border-box;
}
@keyframes popIn {
    from {
        transform: scale(0.95);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
#addJobModal.nav-modal.active,
#offDayModal.nav-modal.active,
#jobDetailModal.nav-modal.active {
    justify-content: center;
    align-items: center;
}
#navModal {
    z-index: 1110;
}
#navModal .nav-sheet {
    margin: 0 auto 10px auto;
    animation: slideUp 0.2s ease forwards;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 90px;
}

#jobsContainer {
    flex: 1;
    padding: 6px;
}
#weekView,
#calendarView {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
}

/* default state */
#calendarView {
    display: none;
}

/* mobile = week view */
@media (max-width: 768px) {
    #weekView { display: block; padding-top: 5px; }
    #calendarView { display: none; }
}

/* desktop = calendar view */
@media (min-width: 769px) {
    #weekView { display: none; }
    #calendarView { display: block; padding-top: 25px; }
}

/* Ensure header sits above page content but modals stay on top */
@media (min-width: 769px) {
    .header { z-index: 200500; background: rgba(255,255,255,0.98); }
    .nav-modal { z-index: 300000; }
}

body {
    overflow-x: hidden;
}
</style>
</head>

<body>

<div id="screen">

    <div class="header">
        <div class="header-top">
            <div class="header-title">
                Current Jobs
                <button onclick="toggleViewMode()" style="
                    width:28px;
                    height:28px;
                    border-radius:8px;
                    border:none;
                    background:white;
                    box-shadow:0 2px 6px rgba(0,0,0,0.08);
                    font-size:14px;
                    cursor:pointer;
                ">
                    📅
                </button>
            </div>
            <div class="search-pill header-search">
                <input id="jobSearchInput" class="job-search" placeholder="Search job or name…" onkeydown="if(event.key==='Enter') searchJob();" />
                <button class="search-pill-button" onclick="searchJob()">Search</button>
            </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;">

</div>

<!-- NAV MODAL (OUTSIDE SCREEN) -->
<div class="nav-modal" id="navModal">

        <div class="nav-title">
            Navigate With
        </div>

        <button class="nav-btn" onclick="openGoogleMaps()">Google Maps</button>
        <button class="nav-btn" onclick="openAppleMaps()">Apple Maps</button>
        <button class="nav-btn" onclick="openWaze()">Waze</button>
    </div>
</div>
<div id="addJobModal" class="nav-modal">
  <div class="nav-sheet">

    <div style="font-weight:700;margin-bottom:10px;">Add Job</div>

    <input id="jobName" placeholder="Job Name" style="width:100%;padding:10px;margin-bottom:8px;">
    <input id="jobLocation" placeholder="Location" style="width:100%;padding:10px;margin-bottom:8px;">

<textarea id="jobDescription" placeholder="Description" style="
    width:100%;

    margin-bottom:8px;

"></textarea>
    <button onclick="submitJob()">Create Job</button>

  </div>
</div>


<div id="jobDetailModal" class="nav-modal">
    <div class="nav-sheet">

        <div style="font-weight:700;font-size:18px;margin-bottom:10px;">
            Job Details
        </div>

        <div style="margin-bottom:10px;">
            <strong>Customer</strong>
            <div id="detailName"></div>
        </div>

        <div style="margin-bottom:10px;">
            <strong>Address</strong>
            <div id="detailAddress" style="color:#0073ea;cursor:pointer;" onclick="openNavigation(currentJob.location)"></div>
        </div>

            <div id="detailPhone"></div>

            <strong>Description</strong>
            <div id="detailDescription"></div>

            <strong>Laborers</strong>

  <select id="detailLaborers" style="

    border-radius:8px;
    border:1px solid #ddd;
">
    <option value="1">1 Laborer</option>
    <option value="2">2 Laborers</option>
    <option value="3">3 Laborers</option>
    <option value="4">4 Laborers</option>

</select>

<!-- ⭐ ADD THIS RIGHT HERE -->
<div style="margin-top:12px;">
    <div style="font-weight:600;margin-bottom:6px;">
        Media Rating
    </div>

    <div id="ratingStars" style="
        display:flex;
        gap:6px;
        font-size:26px;
        cursor:pointer;
    ">
    </div>
</div>

<button onclick="saveLaborers()">
    Save
</button>
</div>
</div>
</div>

<!-- PUT OFF DAY MODAL RIGHT HERE -->
<div id="offDayModal" class="nav-modal">
  <div class="nav-sheet">

    <div style="font-weight:700;margin-bottom:10px;">Add Off Day</div>

    <input id="offName" placeholder="Person" style="width:100%;padding:10px;margin-bottom:8px;">
   <input id="offStart" type="date" style="width:100%;padding:10px;margin-bottom:8px;">
<input id="offEnd" type="date" style="width:100%;padding:10px;margin-bottom:12px;">

    <button onclick="submitOffDay()">Save Off Day</button>

  </div>
</div>

<script>
const ESTIMATOR_RULES = [
    { key: "tom", color: "#ff3b30" },
    { key: "brad", color: "#000000" },
    { key: "matt", color: "#0073ea" }
];
let viewMode = "week";
let isDragging = false;
let startX = 0;
let currentX = 0;
let translateX = 0;
let weekOffset = 0;
let monthOffset = 0;
const BOARD_ID = 18411800966;

const apiToken = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1OTAwMTUzOSwiYWFpIjoxMSwidWlkIjoxMDMyMTQ4NzcsImlhZCI6IjIwMjYtMDUtMTVUMTQ6NTY6MDguMDAwWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM0OTg5MTQ2LCJyZ24iOiJ1c2UxIn0.Qo7Od1W81aOHJDMCzDmhdJ_-7dAexxnpTN4468PGln0";

let allJobs = [];
let navigationAddress = "";
let offDays = [];

try {
    offDays = JSON.parse(localStorage.getItem("offDays")) || [];
} catch (e) {
    offDays = [];
}

// ================= LOADING =================
function showLoading() {
    const container =
        document.getElementById("weekView") ||
        document.getElementById("calendarView");

    if (!container) return;

    container.innerHTML = "";

    for (let i = 0; i < 5; i++) {
        container.innerHTML += `
            <div class="shimmer-card">
                <div class="shimmer" style="width:60%"></div>
                <div class="shimmer" style="width:90%"></div>
                <div class="shimmer" style="width:40%"></div>
            </div>
        `;
    }
}
function setInitialView() {
    if (window.innerWidth >= 769) {
        viewMode = "calendar";
    } else {
        viewMode = "week";
    }
}

setInitialView();

window.addEventListener("resize", () => {
    if (window.innerWidth >= 769) {
        viewMode = "calendar";
    } else {
        viewMode = "week";
    }

    refreshUI();
});
async function loadOffDays() {
    const query = `
    query {
        boards(ids: [18416843280]) {
            items_page(limit: 200) {
                items {
                    name
                    column_values(ids: [
                        "text_mm443k8p",
                        "date_mm44r5ag",
                        "date_mm44r779"
                    ]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data?.data?.boards?.[0]?.items_page?.items || [];

    offDays = items.map(item => {
        const get = (id) =>
            item.column_values.find(c => c.id === id)?.text || "";

        return {
            name: get("text_mm443k8p") || item.name,
            startDate: get("date_mm44r5ag"),
            endDate: get("date_mm44r779") || get("date_mm44r5ag")
        };
    });

    refreshUI();
}

// ================= LOAD =================
async function loadJobs() {

    showLoading();

    const query = `
    query {
        boards(ids: [${BOARD_ID}]) {
            items_page(limit: 200) {
                items {
                    id
                    name
                    group { title }
    column_values(ids: [
    "text_mm3zf47z",
    "date_mm3zmjgk",
    "date_mm45r6e3",
    "long_text_mm40xxhd",
    "text_mm46zh5y",
    "numeric_mm46tmad",
    "numeric_mm47xfw2",
    "text_mm483ea4"
]) {
                        id
                        text
                    }
                }
            }
        }
    }`;

    const res = await fetch("https://api.monday.com/v2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": apiToken
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const items = data?.data?.boards?.[0]?.items_page?.items || [];
    allJobs = items.map(parseJob).filter(Boolean);

    refreshUI();
}

// ================= PARSE =================
function parseJob(item) {
    const name = item.name || "";
    const groupRaw = (item.group?.title || "").trim().toLowerCase();

    // prefer explicit estimator column from Monday if present
    const estimatorCol = (item.column_values.find(c => c.id === "text_mm483ea4")?.text || "").trim().toLowerCase();

    const originalEstimator = estimatorCol || groupRaw || "unknown";

    let estimator;
    // repair group should always be recognized first
    if (groupRaw.includes("repair")) {
        estimator = "repair";
    } else if (estimatorCol.includes("tom")) {
        estimator = "tom";
    } else if (estimatorCol.includes("brad")) {
        estimator = "brad";
    } else if (estimatorCol.includes("matt")) {
        estimator = "matt";
    } else if (groupRaw.includes("tom")) {
        estimator = "tom";
    } else if (groupRaw.includes("brad")) {
        estimator = "brad";
    } else if (groupRaw.includes("matt")) {
        estimator = "matt";
    } else if (groupRaw.includes("completed")) {
        // fallback to completed when no estimator info available
        estimator = "completed";
    } else {
        estimator = "unknown";
    }

    const job = {
        id: item.id,
        name,
        estimator,
        originalEstimator,

        location: "",
        phone: "",
        laborers: 1,
        rating: 0,

        date: "",
        endDate: "",
        description: ""
    };

    item.column_values.forEach(col => {
        if (col.id === "text_mm3zf47z") job.location = col.text || "";
        if (col.id === "date_mm3zmjgk") job.date = col.text || "";

function getCurrentJobs() {

    const now = new Date();

    const start = new Date(now);
    const day = now.getDay();
    const diff = (day === 0 ? -6 : 1) - day;

    start.setDate(start.getDate() + diff + (weekOffset * 7));
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    return allJobs
        .filter(job => {
            if (!job.date) return false;

            const [y,m,d] = job.date.split("-");
            const jobDate = new Date(y, m-1, d);

            return jobDate >= start && jobDate <= end;
        })
        .sort((a,b) => {
            const [ay,am,ad] = a.date.split("-");
            const [by,bm,bd] = b.date.split("-");
            return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
        });
}

function handleSwipe() {
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;

    // ignore small gestures
    if (Math.abs(diffX) < 60) return;

    // ignore vertical scroll gestures
    if (Math.abs(diffY) > Math.abs(diffX)) return;

    if (diffX > 0) {
        changeWeek(-1);
    } else {
        changeWeek(1);
    }
}

function searchJob() {
    const term = document
        .getElementById("jobSearchInput")
        .value
        .trim()
        .toLowerCase();

    if (!term) {
        showToast("Enter a job name or location to search");
        return;
    }

    const match = allJobs.find(job => {
        const name = (job.name || "").toLowerCase();
        const location = (job.location || "").toLowerCase();
        return name.includes(term) || location.includes(term);
    });

    if (!match) {
        showToast(`No job found for "${term}"`);
        return;
    }

    if (viewMode === "week" && match.date) {
        const now = new Date();
        const day = now.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        const start = new Date(now);
        start.setDate(start.getDate() + diff);
        start.setHours(0, 0, 0, 0);

        const jobDate = new Date(match.date);
        const offset = Math.round((jobDate - start) / (7 * 24 * 60 * 60 * 1000));
        weekOffset = offset;
    }

    if (viewMode === "calendar" && match.date) {
        const date = new Date(match.date);
        const currentMonth = new Date();
        monthOffset = (date.getFullYear() - currentMonth.getFullYear()) * 12 + (date.getMonth() - currentMonth.getMonth());
    }

    refreshUI();

    const viewEl = document.getElementById(viewMode === "week" ? "weekView" : "calendarView");
    if (viewEl) {
        viewEl.scrollTop = 0;
    }

    setTimeout(() => openJobDetail(match.id), 220);
}

async function saveInstallDate(jobId, value) {
    if (!value) return;

    // 1. Save locally (for instant UI)
    installDates[jobId] = value;
    localStorage.setItem('installDates', JSON.stringify(installDates));

    const job = allJobs.find(j => j.id === jobId);
    if (job) {
        job.installDate = value;
    }

    try {
        // 2. Send to Monday.com (THIS is what you were missing)
 const mutation = `
mutation {
    change_column_value(
        item_id: ${jobId},
        board_id: ${BOARD_ID},
        column_id: "date_mm45r6e3",
        value: ${JSON.stringify(JSON.stringify({ date: value }))}
    ) {
        id
    }
}
`;

        const response = await fetch("https://api.monday.com/v2", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": apiToken
            },
            body: JSON.stringify({ query: mutation })
        });

        const data = await response.json();

        if (data.errors) {
            throw new Error(data.errors[0].message);
        }

        console.log("Install date saved to Monday:", value);

        // optional refresh
        renderJobs();

    } catch (err) {
        console.error("Monday save failed:", err);
        alert("Failed to save install date to Monday");
    }
}

let safariMenuOpen = false;

function toggleSafariMenu() {
    safariMenuOpen = !safariMenuOpen;
    const overlay = document.getElementById("safariMenuOverlay");
    overlay.classList.toggle("active", safariMenuOpen);
    document.body.classList.toggle("menu-open", safariMenuOpen);
}

function closeSafariMenu() {
    safariMenuOpen = false;
    document.getElementById("safariMenuOverlay").classList.remove("active");
    document.body.classList.remove("menu-open");
}

function handleSafariOverlayClick(event) {
    if (event.target.id === "safariMenuOverlay") {
        closeSafariMenu();
    }
}

function goToHome() {
    closeSafariMenu();
    if (window.location.pathname.endsWith("index.html") || window.location.pathname.endsWith("/")) return;
    window.location.href = "index.html";
}

function goToCurrentJobs() {
    closeSafariMenu();
    if (window.location.pathname.endsWith("currentjobs.html")) return;
    window.location.href = "currentjobs.html";
}

function goToJobTracker() {
    closeSafariMenu();
    if (window.location.pathname.endsWith("jobtracker.html")) return;
    window.location.href = "jobtracker.html";
}

async function setRating(jobId, value) {

    const job = allJobs.find(j => j.id == jobId);
    if (!job) return;

    job.rating = value;

    const mutation = `
    mutation {
      change_column_value(
        item_id: ${jobId},
        board_id: ${BOARD_ID},
        column_id: "numeric_mm47xfw2",
        value: "${value}"
      ) {
        id
      }
    }`;

    try {
        await fetch("https://api.monday.com/v2", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": apiToken
            },
            body: JSON.stringify({ query: mutation })
        });

        showToast(`Rating set to ${value}★`);

        renderCalendar(); // refresh UI so it updates visually

    } catch (err) {
        console.error(err);
        showToast("Rating update failed");
    }
}
